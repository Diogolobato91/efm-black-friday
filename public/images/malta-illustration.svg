<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1200" viewBox="0 0 1000 1200" fill="none">
  <title>Ilustração de Valletta, Malta</title>
  <desc>Interpretação gráfica original da paisagem de Valletta: cúpula, torre, edifícios de pedra clara e barcos no Mediterrâneo. Não é fotografia.</desc>
  <defs>
    <linearGradient id="sky" x1="500" y1="0" x2="500" y2="900" gradientUnits="userSpaceOnUse"><stop stop-color="#5179A4"/><stop offset=".55" stop-color="#9DBED1"/><stop offset="1" stop-color="#E4D9B9"/></linearGradient>
    <linearGradient id="sea" x1="500" y1="750" x2="500" y2="1200" gradientUnits="userSpaceOnUse"><stop stop-color="#0C658D"/><stop offset="1" stop-color="#073D6B"/></linearGradient>
    <linearGradient id="stone" x1="0" y1="450" x2="800" y2="950" gradientUnits="userSpaceOnUse"><stop stop-color="#EAD5A8"/><stop offset="1" stop-color="#AA8159"/></linearGradient>
    <linearGradient id="dome" x1="510" y1="340" x2="735" y2="510" gradientUnits="userSpaceOnUse"><stop stop-color="#F3E2BB"/><stop offset=".5" stop-color="#D8BE8D"/><stop offset="1" stop-color="#A98861"/></linearGradient>
    <pattern id="windows" width="48" height="67" patternUnits="userSpaceOnUse"><path d="M17 16h15v27H17z" fill="#554E48"/><path d="M16 44h17" stroke="#E7D0A4" stroke-width="5"/></pattern>
    <pattern id="masonry" width="120" height="44" patternUnits="userSpaceOnUse"><path d="M0 43h120M60 0v43" stroke="#9C7857" stroke-opacity=".35" stroke-width="2"/></pattern>
    <filter id="grain"><feTurbulence type="fractalNoise" baseFrequency=".7" numOctaves="3" stitchTiles="stitch"/><feColorMatrix type="saturate" values="0"/><feComponentTransfer><feFuncA type="linear" slope=".08"/></feComponentTransfer><feBlend in="SourceGraphic" mode="soft-light"/></filter>
  </defs>
