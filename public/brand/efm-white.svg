<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 512 512' width='512' height='512' role='img' aria-label='EFM Languages Logo'>
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Outfit:wght@800;900&amp;display=swap');
      .efm-brand-letters { font-family: 'Outfit', 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif; font-weight: 900; }
      .efm-lang-letters { font-family: 'Outfit', 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif; font-weight: 800; }
    </style>
  </defs>
  <!-- Background: Quadrada com bordas minimamente arredondadas -->
  <rect width='512' height='512' rx='36' ry='36' fill='#FFFFFF' stroke='rgba(6, 25, 56, 0.12)' stroke-width='2' />

  <!-- Zoomed typography group filling the square with bold visibility -->
  <g transform='translate(256, 250) scale(1.18) translate(-256, -260)'>
    <!-- 'ef' in vibrant orange -->
    <text x='54' y='272' fill='#F25C05' font-size='204' class='efm-brand-letters' letter-spacing='-12'>ef</text>
    
    <!-- 'm' in contrasting color -->
    <text x='268' y='272' fill='#061938' font-size='204' class='efm-brand-letters' letter-spacing='-12'>m</text>
    
    <!-- Overlap connection between f crossbar and m shoulder -->
    <path d='M 260 170 L 298 170 L 278 190 Z' fill='#F25C05' />
    
    <!-- 'LANGUAGES' subtitle with generous tracking -->
    <text x='262' y='336' fill='#061938' font-size='39' class='efm-lang-letters' text-anchor='middle' letter-spacing='19'>LANGUAGES</text>
    
    <!-- Upward curved orange horizon arc -->
    <path d='M 48 366 Q 256 345 464 366 Q 256 353 48 366 Z' fill='#F25C05' />
  </g>
</svg>
